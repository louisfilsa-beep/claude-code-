# Builds the DriveAruba Learn app (Vite + React in ./learn) and publishes it
# to the root of the GitHub Pages site (https://<owner>.github.io/claude-code-/).
#
# IMPORTANT one-time setup: in the repo's Settings -> Pages, set
# "Build and deployment" -> Source to "GitHub Actions" (instead of a branch).
# Until that's switched, this workflow builds successfully but nothing is published.
name: Deploy DriveAruba Learn to GitHub Pages

on:
  push:
    branches:
      - claude/quirky-euler-awf8te # current default branch
      - main # in case the default branch is renamed later
  workflow_dispatch: # lets you trigger a deploy manually from any branch

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deploy at a time; never cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: learn/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: learn

      - name: Build
        run: npm run build
        working-directory: learn

      - name: Assemble Pages site
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          # The built app IS the whole site now.
          cp -r learn/dist/. _site/
          # .nojekyll stops Pages from running Jekyll over the output.
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
