# Builds and deploys the whole GitHub Pages site:
#   /        -> the existing Velox AI landing page (static index.html at repo root)
#   /learn/  -> DriveAruba Learn (the Vite + React app in ./learn)
#
# IMPORTANT one-time setup: in the repo's Settings -> Pages, set
# "Build and deployment" -> Source to "GitHub Actions" (instead of a branch).
# Until that's switched, this workflow builds successfully but nothing is published.
name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - claude/quirky-euler-awf8te # current default branch
      - main # in case the default branch is renamed later
  workflow_dispatch: # lets you trigger a deploy manually from any branch

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deploy at a time; never cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: learn/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: learn

      - name: Build DriveAruba Learn
        run: npm run build
        working-directory: learn

      - name: Assemble Pages site
        run: |
          set -e
          rm -rf _site
          mkdir -p _site/learn
          # Root of the site = the existing Velox AI landing page.
          cp index.html _site/index.html
          # .nojekyll stops Pages from running Jekyll over the output.
          if [ -f .nojekyll ]; then cp .nojekyll _site/.nojekyll; else touch _site/.nojekyll; fi
          # DriveAruba Learn lives at /learn (copy contents, incl. dotfiles).
          cp -r learn/dist/. _site/learn/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
